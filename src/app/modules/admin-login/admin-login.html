<div class="admin-login-modulo">
    <div class="admin-login-card">
        <div class="admin-login-header">
            <div class="icono-restringido">🔐</div>
            <h2>Portal del Personal</h2>
            <p>Acceso para médicos y personal administrativo.</p>
            <div class="linea-decorativa-roja"></div>
        </div>@if(errorAutenticacion){<div class="alerta-error-admin">{{mensajeError}}</div>}<form
            #formAdminAuth="ngForm" (ngSubmit)="ejecutarLoginAdmin()">
            <div class="campo-admin-grupo"><label>Correo de empleado</label><input type="email" name="email"
                    [(ngModel)]="credencialesAdmin.email" required placeholder="correo@ejemplo.com"></div>
            <div class="campo-admin-grupo"><label>Contraseña</label><input type="password" name="contrasenia"
                    [(ngModel)]="credencialesAdmin.contrasenia" required></div><button type="submit"
                class="btn-admin-login-submit" [disabled]="!formAdminAuth.form.valid || cargando">{{cargando ?
                'Verificando...' : 'Ingresar al portal'}}</button>
        </form>
    </div>
</div>
