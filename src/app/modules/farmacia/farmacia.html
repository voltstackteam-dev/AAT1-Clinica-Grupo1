<div class="farmacia-modulo">
  
  <!-- Banner Informativo -->
  <div class="farmacia-hero">
    <div class="farmacia-hero-overlay">
      <h1>Farmacia Voltstack</h1>
      <p>Medicamentos certificados con entrega inmediata y total seguridad</p>
    </div>
  </div>

  <!-- Barra de Navegación por Categorías -->
  <div class="categorias-nav-bar">
    <button (click)="categoriaSeleccionada = 'Todos'" [class.activo]="categoriaSeleccionada === 'Todos'">Todos</button>
    <button (click)="categoriaSeleccionada = 'Analgésicos'" [class.activo]="categoriaSeleccionada === 'Analgésicos'">Analgésicos</button>
    <button (click)="categoriaSeleccionada = 'Antibióticos'" [class.activo]="categoriaSeleccionada === 'Antibióticos'">Antibióticos</button>
    <button (click)="categoriaSeleccionada = 'Antihistamínicos'" [class.activo]="categoriaSeleccionada === 'Antihistamínicos'">Antihistamínicos</button>
    <button (click)="categoriaSeleccionada = 'Vitaminas'" [class.activo]="categoriaSeleccionada === 'Vitaminas'">Vitaminas</button>
  </div>

  <!-- Grilla de Productos -->
  <div class="productos-catalogo-grid">
    <div *ngFor="let prod of productosFiltrados" class="producto-card">
      <div class="producto-imagen-contenedor">
        <img [src]="prod.foto" [alt]="prod.nombre" class="img-medicamento" />
        <span class="badge-categoria">{{ prod.categoria }}</span>
      </div>
      
      <div class="producto-info-cuerpo">
        <h3>{{ prod.nombre }}</h3>
        <p class="producto-precio">Q {{ prod.precio.toFixed(2) }}</p>
        
        <!-- Indicador de Stock condicional -->
        <span class="stock-indicador" [class.en-stock]="prod.disponibilidad">
          {{ prod.disponibilidad ? '● En Stock' : '🚫 Agotado' }}
        </span>

        <!-- Botón interactivo que bloquea la compra si no hay existencias -->
        <button 
          class="btn-carrito" 
          [disabled]="!prod.disponibilidad"
          (click)="agregarAlCarrito(prod.id)">
          {{ prod.disponibilidad ? 'Añadir al Carrito' : 'Sin Existencias' }}
        </button>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
     COMPONENTES DEL ASISTENTE VIRTUAL FLOTANTE (AÑADIDO)
     ========================================================================== -->
  
  <!-- 1. Botón Disparador Circular -->
  <button class="btn-asistente-flotante" (click)="alternarChat()">
    <span *ngIf="!chatAbierto">💬 Asistente IA</span>
    <span *ngIf="chatAbierto">❌ Cerrar</span>
  </button>

  <!-- 2. Ventana Emergente del Chat -->
  <div class="chat-ventana-emergente" *ngIf="chatAbierto">
    
    <!-- Encabezado del Asistente -->
    <div class="chat-header-institucional">
      <div class="chat-avatar-status">🤖</div>
      <div>
        <h4>Volty - Farmacia</h4>
        <span class="status-en-linea">● En línea ahora</span>
      </div>
    </div>

    <!-- Cuerpo de Mensajes -->
    <div class="chat-cuerpo-mensajes">
      <div *ngFor="let msg of historialMensajes" [ngClass]="['mensaje-bloque', msg.emisor]">
        <div class="mensaje-burbuja">
          {{ msg.texto }}
        </div>
      </div>
    </div>

    <!-- Barra Inferior de Entrada de Texto -->
    <div class="chat-barra-entrada">
      <input 
        type="text" 
        placeholder="Escribe tu consulta médica..." 
        [(ngModel)]="mensajeUsuario"
        (keyup.enter)="enviarMensajeChat()" />
      <button (click)="enviarMensajeChat()">▶</button>
    </div>

  </div>

</div>
