<div class="registro-modulo-container"><div class="alerta-exito-registro" *ngIf="exitoRegistro"><h3>Cuenta creada</h3><p>Redirigiendo al inicio de sesión.</p></div><div class="registro-card-box" *ngIf="!exitoRegistro"><div class="registro-header"><h2>Registro de Paciente</h2></div><p *ngIf="mensajeError" class="alerta-error-login">{{ mensajeError }}</p><form #formRegistro="ngForm" (ngSubmit)="ejecutarRegistro()"><div class="campo-grupo"><label>Nombre</label><input name="nombre" [(ngModel)]="nuevoUsuario.nombre" required></div><div class="campo-grupo"><label>Apellido</label><input name="apellido" [(ngModel)]="nuevoUsuario.apellido" required></div><div class="campo-grupo"><label>Fecha de nacimiento</label><input type="date" name="fecha_nacimiento" [(ngModel)]="nuevoUsuario.fecha_nacimiento" required></div><div class="campo-grupo"><label>Teléfono</label><input name="telefono" [(ngModel)]="nuevoUsuario.telefono" required></div><div class="campo-grupo"><label>Dirección</label><input name="direccion" [(ngModel)]="nuevoUsuario.direccion"></div><div class="campo-grupo"><label>Correo electrónico</label><input type="email" name="email" [(ngModel)]="nuevoUsuario.email" required></div><div class="campo-grupo"><label>Contraseña</label><input type="password" name="contrasenia" [(ngModel)]="nuevoUsuario.contrasenia" required></div><button type="submit" class="btn-registro-enviar" [disabled]="!formRegistro.form.valid">Crear cuenta médica</button></form><div class="registro-footer-enlaces"><p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p></div></div></div>
