<section class="agenda-cita-container">
    <div class="agenda-card">
        <div class="agenda-header">
            <h2>Agenda tu Cita Médica</h2>
            <p>Selecciona una franja disponible del médico.</p>
        </div>@if(mensaje()){<div class="mensaje-cita" [class.mensaje-error]="error()">{{mensaje()}}</div>}
        @if (!sesionActiva()) {
            <div class="aviso-sesion"><p>Necesitas iniciar sesión para agendar una cita médica.</p><button type="button" (click)="irALogin()">Iniciar sesión</button></div>
        } @else if (esPaciente()) {
        <form
            (ngSubmit)="confirmarCita()" class="agenda-form">
            <div class="form-grid">
                <div class="form-group"><label>Médico *</label><select [ngModel]="idMedico()"
                        (ngModelChange)="idMedico.set(+$event);cambiarMedico()" name="medico">
                        <option [value]="0">Selecciona un médico</option>@for(medico of medicos();track
                        medico.id_medico){<option [value]="medico.id_medico">{{medico.nombre}} {{medico.apellido}}
                        </option>}
                    </select></div>
                <div class="form-group"><label>Sala *</label><select [ngModel]="idSala()"
                        (ngModelChange)="idSala.set(+$event)" name="sala">
                        <option [value]="0">Selecciona una sala</option>@for(sala of salas();track sala.id_sala){<option
                            [value]="sala.id_sala">{{sala.nombre_sala}}</option>}
                    </select></div>
                <div class="form-group"><label>Fecha *</label><input type="date" [min]="hoy" [ngModel]="fecha()"
                        (ngModelChange)="fecha.set($event);actualizarHoras()" name="fecha"></div>
                <div class="form-group"><label>Hora disponible *</label><select [ngModel]="hora()"
                        (ngModelChange)="hora.set($event)" name="hora" [disabled]="!horas().length">
                        <option value="">Selecciona una hora</option>@for(horaDisponible of horas();track
                        horaDisponible){<option [value]="horaDisponible">{{horaDisponible}}</option>}
                    </select></div>
                <div class="form-group full-width"><label>Motivo</label><textarea [ngModel]="motivoConsulta()"
                        (ngModelChange)="motivoConsulta.set($event)" name="motivo" rows="4"></textarea></div>
            </div>
            <div class="form-actions"><button type="submit" class="btn-confirmar"
                    [disabled]="cargando()">{{cargando()?'Guardando...':'Confirmar cita'}}</button></div>
        </form>
        }
    </div>
</section>
