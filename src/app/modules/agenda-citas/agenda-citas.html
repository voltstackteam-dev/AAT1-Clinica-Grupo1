<section class="agenda-cita-container">
  <div class="agenda-card">

    <div class="agenda-header">
      <h2>Agenda tu Cita Médica</h2>

      <p>
        Completa el formulario para reservar tu espacio
        con nuestros especialistas certificados
      </p>
    </div>

<!--  MENSAJE */ --> 

    @if (mensaje()) {
      <div
        class="mensaje-cita"
        [class.mensaje-error]="error()"
        [class.mensaje-exito]="!error()"
      >
        {{ mensaje() }}
      </div>
    }


    <form
      (ngSubmit)="confirmarCita()"
      class="agenda-form"
    >

      <div class="form-grid">


        <!--  MÉDICO -->
        
        <div class="form-group">

          <label for="medico">
            Médico *
          </label>

          <select
            id="medico"
            [ngModel]="idMedico()"
            (ngModelChange)="idMedico.set(+$event)"
            name="medico"
            required
          >

            <option [value]="0" disabled>
              Selecciona un médico
            </option>

            @for (medico of medicos(); track medico.id_medico) {

              <option [value]="medico.id_medico">

                Dr./Dra.
                {{ medico.nombre_med }}
                {{ medico.apellido_med }}

              </option>

            }

          </select>

        </div>


        <!--  CLIENTE -->
        
        <div class="form-group">

          <label for="cliente">
            Paciente *
          </label>

          <select
            id="cliente"
            [ngModel]="idCliente()"
            (ngModelChange)="idCliente.set(+$event)"
            name="cliente"
            required
          >

            <option [value]="0" disabled>
              Selecciona un paciente
            </option>

            @for (cliente of clientes(); track cliente.id_cliente) {

              <option [value]="cliente.id_cliente">

                {{ cliente.nombre_cli }}
                {{ cliente.apellido_cli }}

              </option>

            }

          </select>

        </div>


<!--         SALA
 -->       
        <div class="form-group">

          <label for="sala">
            Sala *
          </label>

          <select
            id="sala"
            [ngModel]="idSala()"
            (ngModelChange)="idSala.set(+$event)"
            name="sala"
            required
          >

            <option [value]="0" disabled>
              Selecciona una sala
            </option>

            @for (sala of salas(); track sala.id_sala) {

              <option [value]="sala.id_sala">

                {{ sala.nombre_sala }}

              </option>

            }

          </select>

        </div>


<!--              HORARIO
 -->
        <div class="form-group">

          <label for="horario">
            Fecha y hora *
          </label>

          <select
            id="horario"
            [ngModel]="idHorario()"
            (ngModelChange)="idHorario.set(+$event)"
            name="horario"
            required
          >

            <option [value]="0" disabled>
              Selecciona un horario
            </option>

            @for (horario of horarios(); track horario.id_horario) {

              <option [value]="horario.id_horario">

                {{ horario.fecha }}
                -
                {{ horario.hora_reserva }}

              </option>

            }

          </select>

        </div>


            <!--  MOTIVO -->

        <div class="form-group full-width">

          <label for="motivo">
            Motivo de la consulta *
          </label>

          <textarea
            id="motivo"
            [ngModel]="motivoConsulta()"
            (ngModelChange)="motivoConsulta.set($event)"
            name="motivo"
            placeholder="Describe brevemente el motivo de la consulta"
            rows="4"
            required
          ></textarea>

        </div>

      </div>

<!-- BOTÓN -->
      <div class="form-actions">

        <button
          type="submit"
          class="btn-confirmar"
          [disabled]="cargando()"
        >

          {{
            cargando()
              ? 'Guardando cita...'
              : 'Confirmar Reservación de Cita'
          }}

        </button>

      </div>

    </form>

  </div>
</section>
