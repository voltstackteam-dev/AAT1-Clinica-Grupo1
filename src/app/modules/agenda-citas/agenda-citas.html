<section class="agenda-cita-container">
  <div class="agenda-card">
    <div class="agenda-header">
      <h2>Agenda tu Cita Médica</h2>
      <p>Completa el formulario para reservar tu espacio con nuestros especialistas certificados</p>
    </div>

    <form (ngSubmit)="confirmarCita()" class="agenda-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre Completo del Paciente *</label>
          <input 
            type="text" 
            id="nombre"
            [ngModel]="nombrePaciente()" 
            (ngModelChange)="nombrePaciente.set($event)" 
            name="nombre" 
            placeholder="Ej. Juan Pérez" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="dpi">Documento de Identificación (DPI) *</label>
          <input 
            type="text" 
            id="dpi"
            [ngModel]="dpiPaciente()" 
            (ngModelChange)="dpiPaciente.set($event)" 
            name="dpi" 
            placeholder="Ej. 1234 56789 0101" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico *</label>
          <input 
            type="email" 
            id="email"
            [ngModel]="emailPaciente()" 
            (ngModelChange)="emailPaciente.set($event)" 
            name="email" 
            placeholder="juan@correo.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono de Contacto *</label>
          <input 
            type="text" 
            id="telefono"
            [ngModel]="telefonoPaciente()" 
            (ngModelChange)="telefonoPaciente.set($event)" 
            name="telefono" 
            placeholder="5555-5555" 
            required 
          />
        </div>

        <div class="form-group full-width">
          <label for="especialidad">Especialidad Requerida</label>
          <select 
            id="especialidad"
            [ngModel]="idEspecialidad()" 
            (ngModelChange)="idEspecialidad.set($event)" 
            name="especialidad"
          >
            <option [value]="1">Cardiología</option>
            <option [value]="2">Pediatría</option>
          </select>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha de la Cita *</label>
          <input 
            type="date" 
            id="fecha"
            [ngModel]="fechaCita()" 
            (ngModelChange)="fechaCita.set($event)" 
            name="fecha" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="hora">Hora de la Cita *</label>
          <select 
            id="hora"
            [ngModel]="horaCita()" 
            (ngModelChange)="horaCita.set($event)" 
            name="hora" 
            required
          >
            <option value="" disabled selected>Selecciona un turno</option>
            <option value="08:00:00">08:00 AM</option>
            <option value="09:00:00">09:00 AM</option>
            <option value="10:00:00">10:00 AM</option>
            <option value="11:00:00">11:00 AM</option>
            <option value="13:00:00">01:00 PM</option>
            <option value="14:00:00">02:00 PM</option>
            <option value="15:00:00">03:00 PM</option>
            <option value="16:00:00">04:00 PM</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-confirmar" [disabled]="cargando()">
          {{ cargando() ? 'Guardando cita...' : 'Confirmar Reservación de Cita' }}
        </button>
      </div>
    </form>
  </div>
</section>
