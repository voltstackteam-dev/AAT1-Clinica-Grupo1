<div class="perfil-container">
  <div class="perfil-card">
    <h2>Mi Perfil</h2>
    <p class="descripcion">Actualiza los datos de tu cuenta.</p>

    <form (ngSubmit)="actualizarPerfil()">

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="perfil.email"
          required
        />
      </div>

      <div class="campo">
        <label for="contrasenia">Nueva contraseña</label>
        <input
          type="password"
          id="contrasenia"
          name="contrasenia"
          [(ngModel)]="perfil.contrasenia"
          placeholder="Dejar vacío si no deseas cambiarla"
        />
      </div>

      @if (mensaje) {
        <p class="mensaje-exito">{{ mensaje }}</p>
      }

      @if (error) {
        <p class="mensaje-error">{{ error }}</p>
      }

      <button type="submit">Guardar cambios</button>

    </form>
  </div>
</div>
